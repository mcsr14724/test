<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FWI Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }
        .container {
            width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 6px;
            margin: 6px 0 12px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9f5ff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>FWI Prediction</h2>

    <form action="/predict" method="post">

        <label>Temperature</label>
        <input type="number" step="any" name="temperature" required>

        <label>Relative Humidity (RH)</label>
        <input type="number" step="any" name="rh" required>

        <label>Wind Speed (WS)</label>
        <input type="number" step="any" name="ws" required>

        <label>Rain</label>
        <input type="number" step="any" name="rain" required>

        <label>FFMC</label>
        <input type="number" step="any" name="ffmc" required>

        <label>DMC</label>
        <input type="number" step="any" name="dmc" required>

        <label>DC</label>
        <input type="number" step="any" name="dc" required>

        <label>ISI</label>
        <input type="number" step="any" name="isi" required>

        <label>BUI</label>
        <input type="number" step="any" name="bui" required>

        <label>Classes (0 or 1)</label>
        <input type="number" name="classes" min="0" max="1" required>

        <label>Region (0 or 1)</label>
        <input type="number" name="region" min="0" max="1" required>

        <button type="submit">Predict FWI</button>
    </form>
</div>

</body>
</html>
